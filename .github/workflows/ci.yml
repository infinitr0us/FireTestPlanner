name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install fireplan
        run: python -m pip install -e "./python[dev]"
      - name: Test
        run: python -m pytest python/tests -q

  web:
    name: Web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check and single-file build
        run: npm run build
      # Real keyboard, mouse and WebGL checks in headless Chrome. Windows runners ship
      # Chrome at the path browser-tests/run.mjs looks for first.
      - name: Browser checks
        if: runner.os == 'Windows'
        env:
          BROWSER_TEST_TIMEOUT_MS: "90000"
        run: node browser-tests/run.mjs
