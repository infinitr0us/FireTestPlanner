<!doctype html>
<html><head><title>Visual consistency regression checks</title><link rel="stylesheet" href="/src/styles.css"></head>
<body style="display:block;overflow:auto;padding:20px">
<h1>Visual consistency regression checks</h1><pre id="report">Running…</pre>
<div id="probe-test" style="width:600px;height:200px;position:relative;background:var(--bg)"></div>
<details><summary>Door, window and set-out drawing (ft-in)</summary><div id="drawing-test" style="max-width:940px"></div></details>
<script type="module">
import * as THREE from 'three';
import { FdsResultsDialog } from '/src/ui/fds-results.ts';
import { FdsDeviceLayer } from '/src/scene/fds-devices.ts';
import { browserResultsSource } from '/src/io/fds-results-source.ts';
import { handleTransportKey, transportButton } from '/src/ui/transport.ts';
import { visualTheme } from '/src/ui/theme.ts';
import { DEVICE_COLORS } from '/src/core/visual.ts';
import { checkOcclusionInspector } from './occlusion.ts';
import { checkThermocoupleView } from './thermocouple-view.ts';
import { newPlan } from '/src/core/plan.ts';
import { buildReportBody, REPORT_CSS } from '/src/export/report.ts';
const results = [], output = document.querySelector('#report');
const check = (name, ok) => {
  results.push({name, passed: Boolean(ok)});
  output.textContent = JSON.stringify(results, null, 2);
  if (!ok) throw Error(name);
};
const waitFor = async predicate => {
  const start = performance.now();
  while (!predicate()) {
    if (performance.now() - start > 4000) throw Error('Timed out: ' + predicate);
    await new Promise(r => setTimeout(r, 10));
  }
};
const key = (element, key, options = {}) => {
  const event = new KeyboardEvent('keydown', {key, bubbles:true, cancelable:true, ...options});
  element.dispatchEvent(event);
  return event;
};
const binary = (values, floats = false) => {
  const data = new Uint8Array(values.length * 4), view = new DataView(data.buffer);
  values.forEach((v,i) => floats ? view.setFloat32(i*4,v,true) : view.setInt32(i*4,v,true));
  return data;
};
const record = data => {
  const out = new Uint8Array(data.length+8), view = new DataView(out.buffer);
  view.setInt32(0,data.length,true); out.set(data,4); view.setInt32(data.length+4,data.length,true); return out;
};
const slice = times => new File([
  ...['TEMPERATURE','temp','C'].map(s=>record(new TextEncoder().encode(s.padEnd(30)))),
  record(binary([0,0,0,1,0,1])),
  ...times.flatMap(t=>[record(binary([t],true)),record(binary([20,21,22,23],true))]),
],'test.sf');
const metadata = 'GRID mesh\n1 1 1\nPDIM\n0 1 0 1 0 1\nTRNX\n0\n0 0\n1 1\nTRNY\n0\n0 0\n1 1\nTRNZ\n0\n0 0\n1 1\nSLCF 1 1\ntest.sf\nTEMPERATURE\ntemp\nC\n';
const deviceMetadata = ['TEMPERATURE','THERMOCOUPLE','WALL TEMPERATURE','GAUGE HEAT FLUX','PRESSURE']
  .map((quantity,i) => `DEVICE\nprobe-${i} % ${quantity}\n0.5 ${0.1+i*0.18} 0.5 0 0 1\n`).join('');
let dialog;
try {
  await checkOcclusionInspector(check, waitFor);
  await checkThermocoupleView(check, waitFor);
  const drawingPlan = newPlan('Door and window set-out');
  drawingPlan.units.display.length = 'ft-in';
  drawingPlan.objects.push({id:'wall',type:'wall',name:'Test wall',polyline_m:[[0,0],[4,0]],height_m:3,thickness_m:0.2,
    openings:[{offset_m:0.5,width_m:1,height_m:2},{offset_m:2,width_m:1,height_m:1,sillHeight_m:1}]});
  const drawing = document.querySelector('#drawing-test');
  const printStyle = document.createElement('style'); printStyle.textContent=REPORT_CSS; document.head.append(printStyle);
  drawing.innerHTML=buildReportBody(drawingPlan,'ft-in');
  check('plan window has two thin parallel glazing strokes', drawing.querySelectorAll('.wall-window line').length===2);
  check('both elevations contain the door and window cut-outs', drawing.querySelectorAll('.wall-opening').length===4
    && drawing.querySelectorAll('polygon[mask]').length===2);
  check('set-out row carries endpoints in fractional feet and inches', drawing.querySelector('.set-out tbody tr').textContent.includes(`P2: 13' 1 1/2"`));

  // Exercise native event targets, not a duplicate of the shortcut decision logic.
  const inputs = ['input','textarea','select','div'].map(tag=>document.createElement(tag));
  inputs.at(-1).contentEditable = 'true';
  let calls = 0;
  const commands = Object.fromEntries(['play','first','last','previous','next'].map(k=>[k,()=>calls++]));
  for (const control of inputs) {
    document.body.append(control);
    control.addEventListener('keydown', e=>handleTransportKey(e,commands));
    for (const k of [' ','.',',','Home','End']) key(control,k);
    control.remove();
  }
  check('typing, selects and editable content keep their keys', calls===0);
  for (const tag of ['button', 'summary', 'a']) {
    const control=document.createElement(tag);
    document.body.append(control);
    control.addEventListener('keydown', e=>handleTransportKey(e,commands));
    check(tag+' retains native Space activation', !key(control,' ').defaultPrevented && calls===0);
    control.remove();
  }
  const detached=document.createElement('div');
  const rootTheme=visualTheme();
  const detachedCanvas=document.createElement('canvas'); detached.append(detachedCanvas);
  const detachedLayer=new FdsDeviceLayer(new THREE.PerspectiveCamera(),detachedCanvas);
  check('theme is available before host attachment', rootTheme.background==='#0f172a' && rootTheme.plotSecondary && rootTheme.plotGrid);
  detachedLayer.dispose();
  check('first and last transport glyphs request text presentation',
    ['first','last'].every(action=>transportButton(action,()=>{}).textContent.endsWith('\uFE0E')));

  const host = document.querySelector('#probe-test'), canvas=document.createElement('canvas');
  canvas.width=600; canvas.height=200; host.append(canvas);
  const camera = new THREE.OrthographicCamera(-1,1,1/3,-1/3,.1,10);
  camera.position.z=2; camera.updateMatrixWorld();
  const layer = new FdsDeviceLayer(camera,canvas);
  layer.resize(600,200,1);
  const probes = ['TEMPERATURE','WALL TEMPERATURE','GAUGE HEAT FLUX','PRESSURE'].map((quantity,i)=>({
    id:quantity, quantity, position:[-.6+i*.4,0,0],
  }));
  layer.setDevices(probes);
  layer.draw();
  const ctx = layer.canvas.getContext('2d');
  const alphaAt = x => ctx.getImageData(x,100,1,1).data[3];
  check('gas temperatures and flux probes are filled; surface and other probes are hollow',
    alphaAt(120)>0 && alphaAt(240)===0 && alphaAt(360)>0 && alphaAt(480)===0);
  const rgb = hex => [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
  check('gas temperature and other probe pixels use the shared colors',
    JSON.stringify([...ctx.getImageData(120,100,1,1).data].slice(0,3))===JSON.stringify(rgb(DEVICE_COLORS.temperature)) &&
    JSON.stringify([...ctx.getImageData(484,100,1,1).data].slice(0,3))===JSON.stringify(rgb(DEVICE_COLORS.other)));
  layer.setSelected(probes[2]); layer.draw();
  check('selected probe has a separate visible ring',ctx.getImageData(372,100,1,1).data[3]>0);
  const unchanged = JSON.stringify(probes);
  layer.setDevices([probes[0],{...probes[1],position:probes[0].position}]);
  layer.draw();
  let picked=[];
  layer.onPick=devices=>picked=devices;
  const rect=canvas.getBoundingClientRect();
  const pointer={button:0,isPrimary:true,pointerId:1,clientX:rect.left+120,clientY:rect.top+100};
  canvas.dispatchEvent(new PointerEvent('pointerdown',pointer));
  canvas.dispatchEvent(new PointerEvent('pointerup',pointer));
  check('coincident probes retain both choices and their source coordinates',picked.length===2 && JSON.stringify(probes)===unchanged);
  layer.setCutaway(-.1); layer.draw();
  check('cutaway hides probes without moving them',ctx.getImageData(120,100,1,1).data[3]===0);
  layer.dispose(); canvas.remove();

  dialog=new FdsResultsDialog(); dialog.open();
  const load=async times=>{
    const files=[new File([metadata,deviceMetadata],'test.smv'),slice(times)];
    await dialog.load(browserResultsSource(files,'test.smv'),'test.smv');
    await waitFor(()=>document.querySelector('dialog output')?.textContent.includes('frame 1/'));
    const device=document.querySelector('[aria-label="Simulation device"]');
    device.value='0'; device.dispatchEvent(new Event('change'));
  };
  await load([0,.25,.75]);
  const modal=document.querySelector('dialog');
  check('gas temperature uses the shared family while retaining its recorded quantity',
    modal.querySelector('optgroup[label="Gas temperatures / thermocouples"]').children.length===2 &&
    modal.querySelector('.fds-results__device-detail').textContent.includes('TEMPERATURE') &&
    modal.querySelector('.fds-results__device-detail').textContent.includes('No facing for this point probe'));
  const slider=modal.querySelector('[aria-label="Simulation frame"]');
  const view=modal.querySelector('.fds-results__view canvas');
  const button=label=>modal.querySelector('button[aria-label="'+label+'"]');
  const at=async n=>waitFor(()=>slider.value===String(n));
  key(view,'End'); await at(2);
  check('canvas End reaches the final frame',modal.querySelector('output').textContent.includes('0.75 s · frame 3/3'));
  key(view,'Home'); await at(0);
  key(slider,'.'); await at(1);
  key(slider,','); await at(0);
  check('scrubber comma and period step frames',slider.value==='0');
  check('scrubber Home and End remain native',!key(slider,'Home').defaultPrevented && !key(slider,'End').defaultPrevented);
  key(view,' ',{ctrlKey:true});
  check('modified shortcuts do not start playback',Boolean(button('Play (Space)')));
  const speed=modal.querySelector('[aria-label="Playback speed"]');
  speed.value='1'; speed.dispatchEvent(new Event('change'));
  key(slider,' ');
  key(slider,' ',{repeat:true});
  check('held Space does not toggle twice',Boolean(button('Pause (Space)')));
  await at(2);
  await waitFor(()=>button('Play (Space)'));
  check('non-looping playback stops at the final frame',slider.value==='2');

  // The final interval is .5 s; it must remain visible before looping.
  const loop=modal.querySelector('.playback-bar__loop input');
  loop.checked=true; loop.dispatchEvent(new Event('change'));
  button('Play (Space)').click();
  await at(0);
  await at(2);
  await new Promise(r=>setTimeout(r,100));
  check('loop keeps the last frame visible',slider.value==='2' && Boolean(button('Pause (Space)')));
  await at(0);
  check('loop returns to the first recorded sample',Boolean(button('Pause (Space)')));
  button('Pause (Space)').click();
  const stopped=slider.value;
  await new Promise(r=>setTimeout(r,300));
  check('pause cancels a scheduled next frame',slider.value===stopped);

  button('First frame (Home)').click(); await at(0);
  button('Play (Space)').click();
  await at(2);
  loop.checked=false; loop.dispatchEvent(new Event('change'));
  await new Promise(r=>setTimeout(r,550));
  check('turning Loop off cancels a pending wrap',slider.value==='2' && Boolean(button('Play (Space)')));
  await load([0]);
  check('single-frame data disables play while preserving inspection',button('Play (Space)').disabled && !slider.disabled);
  const low=modal.querySelector('[aria-label="Color scale minimum"]');
  low.value='999'; low.dispatchEvent(new Event('change'));
  check('invalid scale is marked and explained',low.getAttribute('aria-invalid')==='true' && modal.querySelector('[role=status]').dataset.kind==='error');
  low.value='0'; low.dispatchEvent(new Event('change'));
  await waitFor(()=>modal.querySelector('[role=status]').dataset.kind==='info');
  check('valid scale clears error state',!low.hasAttribute('aria-invalid'));
  // Exercise the shipped real FDS subset as well as the small timing edge cases.
  const publicUrls=import.meta.glob('../../fixtures/fds-results/room_corner*', {query:'?url',import:'default',eager:true});
  const publicFiles=await Promise.all(Object.entries(publicUrls).map(async ([path,url])=>{
    const response=await fetch(url);
    if (!response.ok) throw Error('Missing public fixture: '+path);
    return new File([await response.arrayBuffer()],path.split('/').at(-1));
  }));
  await dialog.load(browserResultsSource(publicFiles,'room_corner.smv'),'room_corner.smv');
  const ready=()=>document.querySelector('dialog [role=status]')?.textContent.includes('mesh file(s) shown');
  await waitFor(ready);
  check('public room case opens all fourteen fields on two meshes',
    modal.querySelector('.fds-results__info').textContent.includes('2 meshes · 14/14 field files available'));
  const devices=modal.querySelector('[aria-label="Simulation device"]');
  check('public case exposes forty probes including doorway velocities',
    devices.querySelectorAll('optgroup option').length===40 && devices.textContent.includes('DOOR_V_HIGH'));
  devices.value=[...devices.options].find(o=>o.textContent.includes('SIDE_HF_1')).value;
  devices.dispatchEvent(new Event('change'));
  check('public gauge keeps recorded coordinates, direction and matching history',
    modal.querySelector('.fds-results__device-detail').textContent.includes('(1.001, 2.35, 0.85)') &&
    modal.querySelector('.fds-results__device-detail').textContent.includes('(1, 0, 0)') &&
    modal.querySelector('[aria-label="Device or heat release history"]').selectedOptions[0].textContent.includes('SIDE_HF_1'));
  const dataset=modal.querySelector('[aria-label="Result dataset"]');
  for (const option of dataset.options) {
    dataset.value=option.value; dataset.dispatchEvent(new Event('change'));
    await waitFor(ready);
    check('public field renders: '+option.textContent, modal.querySelector('[role=status]').dataset.kind!=='error');
  }
  // A real 60-second record still uses recorded-frame stepping, not a fabricated cadence.
  key(modal.querySelector('.fds-results__view canvas'),'End');
  await waitFor(()=>modal.querySelector('output').textContent.includes('60 s · frame 3/3'));
  check('public run seeks to its recorded final time',true);
  dataset.value='0'; dataset.dispatchEvent(new Event('change')); await waitFor(ready);
  // run.mjs continues with real key input on the small timing case.
  if (new URLSearchParams(location.search).has('interactive')) await load([0,.25,.75]);
  else dialog.close();
  output.textContent=JSON.stringify({passed:results.length,checks:results},null,2);
} catch(error) {
  dialog?.close();
  output.textContent+='\nFAILED: '+error.stack;
}
</script></body></html>
