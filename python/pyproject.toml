[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fireplan"
version = "0.9.0"
description = "Read, validate and export fire test plans (.ftp.json)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yuchuan Li" }]
dependencies = [
    "numpy>=1.20",
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/infinitr0us/FireTestPlanner"
Changelog = "https://github.com/infinitr0us/FireTestPlanner/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["fireplan*"]

# The JSON Schemas ship inside the wheel. `Plan.validate_schema()` and every FDS
# conversion read them through importlib.resources, so an install outside this
# repository has to carry them; `fireplan/schemas/` is a byte-identical mirror of
# the normative `schema/` directory at the repository root, held to it by a test.
[tool.setuptools.package-data]
fireplan = ["schemas/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
